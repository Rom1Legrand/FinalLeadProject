version: "3.8"
services:
  mlflow:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mlflow_service
    ports:
      - "7860:7860"
    env_file: .env
    volumes:
      - ./scripts:/home/app/scripts
    command: python /home/app/scripts/test_s3_access.py  # Commande temporaire pour tester S3








